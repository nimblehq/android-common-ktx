[versions]
# SDK versions
androidCompileSdk = "36"
androidMinSdk = "21"
androidTargetSdk = "36"
androidVersionCode = "1"
androidVersionName = "1.0.0"
libVersionName = "0.1.0"

androidx-appcompat = "1.3.1"
androidx-core-ktx = "1.6.0"
androidx-test-espresso = "3.4.0"
androidx-test-junit = "1.1.3"
detekt = "1.23.8"
gradle = "8.13.0"
gson = "2.8.9"
hamcrest = "1.3"
jacoco = "0.8.12"
junit = "4.13.2"
kotlin = "2.2.21"
material = "1.4.0"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }

# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Test
test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
test-hamcrest = { group = "org.hamcrest", name = "hamcrest-library", version.ref = "hamcrest" }
test-junit = { group = "junit", name = "junit", version.ref = "junit" }

# Utilities
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
android-library = { id = "com.android.library", version.ref = "gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
